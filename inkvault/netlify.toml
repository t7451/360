[build]
  base = "inkvault"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Firebase apiKey, Supabase anon key, and similar VITE_* values are
  # PUBLIC client-side identifiers designed to ship in browser bundles.
  # They are NOT secrets — security is enforced by Firebase Rules / Supabase RLS.
  # Disable smart-detection false-positives for this site.
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

# API proxy — route /api calls to Railway backend via env var
[[redirects]]
  from = "/api/*"
  to = ":RAILWAY_API_URL/api/:splat"
  status = 200
  force = true

# SPA catch-all
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-XSS-Protection = "1; mode=block"

# Cache images aggressively
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache JS/CSS assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Never cache HTML
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[build.processing]
  skip_processing = false
[build.processing.css]
  bundle = true
  minify = true
[build.processing.js]
  bundle = true
  minify = true
[build.processing.images]
  compress = true
