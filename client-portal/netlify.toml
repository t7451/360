[build]
  command = "npm run build"
  publish = "dist"

# Firebase apiKey and Supabase anon key are PUBLIC client-side identifiers.
# They are not secrets — security is enforced by Firebase Rules / Supabase RLS.
[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

# API proxy — route /api calls to Railway backend via env var
[[redirects]]
  from = "/api/*"
  to = ":RAILWAY_API_URL/api/:splat"
  status = 200
  force = true

# SPA routing — serve index.html for all routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-XSS-Protection = "1; mode=block"

# Cache static assets aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Don't cache HTML (SPA needs fresh index.html)
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
